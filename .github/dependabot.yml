version: 2
updates:
  - package-ecosystem: "sbt"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
      # scalaVersion is a Scala 2.13 release; Scala 3 is a migration, not a version bump
      - dependency-name: "org.scala-lang:scala-library"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
